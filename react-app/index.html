<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:site" content="@luxenest" />
  <meta property="twitter:title" content="LuxeNest - Home Design & Decor" />
  <meta property="twitter:description"
    content="Transform your living spaces with curated home design inspiration, expert articles, and premium furniture & decor products" />
  <meta property="twitter:image" content="https://static.getmocha.com/og.png" type="image/png" />

    rel="stylesheet">
  <title>LuxeNest - Home Design & Decor</title>
</head>


<style>
  /* Optional: Custom chat size */
  @media (min-width: 768px) {
    #webchat {
      width: 380px !important;
      height: 600px !important;
    }
  }
</style>

<body>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
  <!-- BOTPRESS WEBCHAT — FIXED & WORKING -->
  <script src="https://cdn.botpress.cloud/webchat/v3.4/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2025/12/03/16/20251203164523-8XJZBVHD.js" defer></script>

  <script>
    window.addEventListener("load", () => {
      // CORRECT GLOBAL NAME IS window.botpress (not botpressWebChat)
      if (window.botpress) {
        window.botpress.init({
          botName: "AI Assistant",
          composerPlaceholder: "Ask anything about home design...",

          layout: {
            style: "custom",
            showHeader: true
          },

          theme: "light",
          themeColor: "#5c6bc0",

          customStyles: {
            webchat: {
              width: "380px",
              height: "600px",
              borderRadius: "20px",
              boxShadow: "0 20px 40px rgba(0,0,0,0.15)"
            },
            messageList: {
              height: "480px"
            }
          }
        });
      }
    });
  </script>
</body>

</html>
